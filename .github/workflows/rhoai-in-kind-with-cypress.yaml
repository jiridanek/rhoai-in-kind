name: cypress

on:
  pull_request:
  # only main: a same-repo branch PR otherwise triggers this twice (push + pull_request). See #46
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_repo:
        description: 'odh-dashboard repo to check out (owner/name)'
        default: 'opendatahub-io/odh-dashboard'
      test_ref:
        description: 'odh-dashboard branch/tag/SHA to check out'
        default: 'v2.37.1-odh'
  schedule:
    - cron: '0 2 * * *' # at 02:00

permissions: {}

jobs:
  rhoai-in-kind:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        workbench_branch:
          - v1.36.0

        test_case:
          - "**/workbenches/testWorkbenchControlSuite.cy.ts"

          # this checks user perms but all my users are in effect admins
          - "**/workbenches/testWorkbenchCreation.cy.ts"

          - "**/workbenches/testWorkbenchImages.cy.ts"

          # I'm removing resource requests, so even XXL workbench starts up
          #- "**/workbenches/testWorkbenchNegativeTests.cy.ts"

          - "**/workbenches/testWorkbenchStatus.cy.ts"
          - "**/workbenches/testWorkbenchVariables.cy.ts"
          - "**/workbenches/workbenches.cy.ts"

    steps:

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          # Defaults match the deployed dashboard image (components/04-odh-dashboard.yaml).
          # `main` drifted; its npm-workspaces monorepo layout also broke the install below (#47).
          # Override via workflow_dispatch inputs to test against a fork/branch (e.g. a PR still
          # in review upstream) without editing this file - see #35.
          repository: ${{ inputs.test_repo || 'opendatahub-io/odh-dashboard' }}
          ref: ${{ inputs.test_ref || 'v2.37.1-odh' }}
          path: odh-dashboard
          # Full checkout (no sparse-checkout): odh-dashboard is an npm workspaces monorepo, so
          # `npm ci` at the root needs every workspace (backend, packages/*, frontend, ...) plus
          # the single root package-lock.json to be present.

      # Otherwise we may end up with a random Python version?
      # https://github.com/jiridanek/rhoai-in-kind/issues/16
      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: '3.14'
          pip-version: '26.2.1'

      # ERROR: failed to create cluster: failed to pull image "docker.io/kindest/node:v1.31.6":
      #  command "docker pull docker.io/kindest/node:v1.31.6" failed with error: exit status 1
      # CAUTION: must match node_image below - a drifted pre-pull is silently a no-op (see the
      # istio pre-pull's own history of this exact bug).
      - name: Pre-pull the kind image
        run: timeout 120s bash -c 'while ! docker pull docker.io/kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d; do sleep 1; done'

      - name: Kubernetes KinD Cluster
        id: kind-cluster
        uses: helm/kind-action@v1
        with:
          version: v0.32.0
          # Pinned to v1.34.11 rather than kind v0.32.0's own newer default node image
          # (v1.36.1) - kind release notes recommend pinning by digest, not just tag, until node
          # images get a different tagging scheme, which this still does.
          # Was pinned to v1.31.6 since April 2025 over a "dashboard tests fail on k8s 1.32"
          # comment that turned out to be unrelated to the Kubernetes version at all (see
          # components/deploy.py's "Check storage class" step and PR #77).
          # v1.36.1 was tried and reverted (see issue #98): Kubernetes v1.35 kubelet dropped the
          # container name from Created/Started event messages ("Container created" instead of
          # "Created container: <name>"), which breaks odh-dashboard's message-based oauth-proxy
          # detection in the Workbench status Progress tab (testWorkbenchControlSuite.cy.ts,
          # testWorkbenchStatus.cy.ts) - confirmed via kubelet source diff and unfixed on
          # odh-dashboard main as of this writing. v1.34.11 is the latest kind image still on the
          # pre-v1.35 kubelet message format, and matches what OpenShift 4.21 itself ships.
          # https://hub.docker.com/r/kindest/node/tags
          node_image: "docker.io/kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d"
          cluster_name: kind
          config: components/00-kind-cluster.yaml

      # ✘ Istiod encountered an error: failed to wait for resource: resources not ready after 5m0s: context deadline exceeded
      #    Deployment/istio-system/istiod (container failed to start: ImagePullBackOff: Back-off pulling image "docker.io/istio/pilot:1.25.1")Error: failed to install manifests: failed to wait for resource: resources not ready after 5m0s: context deadline exceeded
      #    Deployment/istio-system/istiod (container failed to start: ImagePullBackOff: Back-off pulling image "docker.io/istio/pilot:1.25.1")
      # CAUTION: must match ISTIO_VERSION in components/deploy.py - it drifted to 1.25.1 here
      # while deploy.py had already moved to 1.26.2, silently making this pre-pull a no-op for
      # the version istiod actually needs. No automated check ties these together; if this ever
      # drifts again, `istioctl install` will still work, just without the pre-pull benefit.
      - name: Pre-pull istio inside kind cluster
        run: |
          set -Eeuxo pipefail
          timeout 120s bash -c 'while ! docker pull docker.io/istio/pilot:1.26.2; do sleep 1; done'
          kind load docker-image docker.io/istio/pilot:1.26.2

      - name: Deploy stuff into Kubernetes
        run: ${PYTHON3} components/deploy.py --workbench-branch=${{ matrix.workbench_branch }}
        env:
          PYTHON3: "${{ steps.setup-python.outputs.python-path }}"

      - name: Print nbc logs
        if: "!cancelled()"
        run: |
          kubectl describe pods -n redhat-ods-applications -l app=notebook-controller
          kubectl logs -n redhat-ods-applications -l app=notebook-controller
      - name: Print odh nbc logs
        if: "!cancelled()"
        run: |
          kubectl describe pods -n redhat-ods-applications -l app=odh-notebook-controller
          kubectl logs -n redhat-ods-applications -l app=odh-notebook-controller

      # this is probably better done with Kyverno

      - name: Bring down Small workbench resource requests
        run: |
          components/patch-workbench-resource-requests.sh

      #- name: Install pnpm
      #  run: |
      #    # https://pnpm.io/installation#using-corepack
      #    corepack enable pnpm
      #    # https://github.com/pnpm/pnpm/issues/5344
      #    corepack use pnpm@latest
      #    corepack prepare pnpm@latest --activate
      #  working-directory: odh-dashboard/frontend

      # https://pnpm.io/continuous-integration#github-actions
      - name: Use Node.js with npm caching
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
          # https://github.com/opendatahub-io/odh-dashboard/pull/3799
          cache-dependency-path: 'odh-dashboard/package-lock.json'

      - name: Setup cypress
        run: |
          set -Eeuxo pipefail
          # odh-dashboard is an npm workspaces monorepo: install from the repo root so all
          # workspaces (incl. frontend) and the cypress binary are set up. husky (a root
          # devDependency) runs via the `prepare` script during install, so no global husky
          # install is needed. See #47.
          npm ci --prefer-offline --no-audit
        working-directory: odh-dashboard

      - name: Run cypress
        run: |
          set -Eeuxo pipefail
          # cypress run -b chrome --project src/__tests__/cypress --env skipTags=@Bug,grepTags=@Smoke --config video=true
          CY_TEST_CONFIG=${{ github.workspace }}/test-variables.yml npm run cypress:run -- --spec '${{ matrix.test_case }}'
        working-directory: odh-dashboard/frontend
        env:
          # dumb, xterm, xterm-256color
          TERM: xterm-256color

      # Error: The artifact name is not valid: cypress-videos-**/workbenches/testWorkbenchVariables.cy.ts. Contains the following character:  Asterisk *
      # Invalid characters include:
      #  Double quote ", Colon :, Less than <, Greater than >, Vertical bar |, Asterisk *, Question mark ?, Carriage return \r, Line feed \n, Backslash \, Forward slash /
      - name: Compute test-output name
        if: "!cancelled()"
        id: artifact-name
        shell: python {0}
        # language: python
        run: |
          import pathlib
          import os
          import re
          
          test_case = os.environ["TEST_CASE"]
          artifact_name = re.sub(r'^.*/(?P<filename>[^/]+)\.robot$', r'\g<filename>', test_case)
          forbidden_characters = "\"\\*/"
          table = str.maketrans(forbidden_characters, "_" * len(forbidden_characters))
          artifact_name = artifact_name.translate(table)
          pathlib.Path(os.environ["GITHUB_OUTPUT"]).write_text(f"artifact-name={artifact_name}")
        env:
          TEST_CASE: ${{ matrix.test_case }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-report-${{ steps.artifact-name.outputs.artifact-name }}
          path: odh-dashboard/frontend/src/__tests__/cypress/results/e2e/index.html

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots-${{ steps.artifact-name.outputs.artifact-name }}
          path: odh-dashboard/frontend/src/__tests__/cypress/results/e2e/screenshots

      - uses: actions/upload-artifact@v7
        if: "!cancelled()"
        with:
          name: cypress-videos-${{ steps.artifact-name.outputs.artifact-name }}
          path: odh-dashboard/frontend/src/__tests__/cypress/results/e2e/videos

      - name: Print nbc logs (again, at the end)
        if: "!cancelled()"
        run: |
          kubectl describe pods -n redhat-ods-applications -l app=notebook-controller
          kubectl logs -n redhat-ods-applications -l app=notebook-controller
      - name: Print odh nbc logs (again, at the end)
        if: "!cancelled()"
        run: |
          kubectl describe pods -n redhat-ods-applications -l app=odh-notebook-controller
          kubectl logs -n redhat-ods-applications -l app=odh-notebook-controller

      - name: Collect logs
        run: ${PYTHON3} components/logs.py
        id: collect-logs
        if: "!cancelled() && steps.kind-cluster.outcome == 'success'"
        env:
          PYTHON3: "${{ steps.setup-python.outputs.python-path }}"

      - name: Archive cluster-logs
        uses: actions/upload-artifact@v7
        if: "steps.collect-logs.outputs.debug_bundle_dir != '' && !cancelled()"
        with:
          name: cluster-logs-${{ steps.artifact-name.outputs.artifact-name }}
          path: ${{ steps.collect-logs.outputs.debug_bundle_dir }}