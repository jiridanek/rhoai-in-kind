---
# The 3.x odh-tests suite (opendatahub-tests 3.3) has a cluster_authentication fixture that
# reads the cluster-wide Authentication (config.openshift.io/v1, canonical name cluster) to
# detect byoIDC (spec.type == OIDC). On a real OpenShift cluster this is a built-in API served
# by the OpenShift API server; on the in-kind base (vanilla Kubernetes) it does not exist, so the
# fixture fails with "Couldn't find Authentication in config.openshift.io api group". A fake CRD
# + cluster instance is enough: the object only needs to be readable. spec.type is left empty so
# is_byoidc is False (matching the real cluster, where the auth type is unset / not OIDC).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    crd/fake: "true"
  name: authentications.config.openshift.io
spec:
  group: config.openshift.io
  names:
    kind: Authentication
    listKind: AuthenticationList
    singular: authentication
    plural: authentications
  scope: Cluster
  versions:
    - name: v1
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      served: true
      storage: true
---
# The cluster-wide Authentication instance (canonical name cluster). spec.type left empty so
# is_byoidc is False (matching the real cluster, where the auth type is unset / not OIDC).
apiVersion: config.openshift.io/v1
kind: Authentication
metadata:
  name: cluster
spec:
  type: ""
