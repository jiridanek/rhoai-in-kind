---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: redhat-ods-applications
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
# https://github.com/argoproj/argo-cd/blob/master/docs/operator-manual/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odh-dashboard
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      # 2025-06-10T21:15:29+00:00 ConfigMap redhat-ods-applications model-catalog-sources OutOfSync Missing
      # ConfigMap "model-catalog-sources" is invalid: metadata.annotations: Too long: must have at most 262144 bytes
      - ServerSideApply=true
  project: redhat-ods-applications
  destination:
    server: https://kubernetes.default.svc
    namespace: redhat-ods-applications
  source:
    repoURL: https://github.com/opendatahub-io/odh-dashboard.git
    path: manifests/rhoai/onprem
    # same problem as pipelines, stable-2.x references main
    # and v2.37.1-odh seems the last without bring-your-own-id-connect
    # https://github.com/opendatahub-io/odh-dashboard/releases/tag/v2.37.1-odh
    targetRevision: v2.37.1-odh
    kustomize:
      patches:
        # https://github.com/opendatahub-io/odh-dashboard/pull/4099
        #- patch: |-
        #    apiVersion: rbac.authorization.k8s.io/v1
        #    kind: ClusterRole
        #    metadata:
        #      name: rhods-dashboard
        #    rules:
        #    - apiGroups:
        #      - rbac.authorization.k8s.io
        #      resources:
        #      - rolebindings
        #      verbs:
        #      - create

        # dashboard manifests use the deprecated var kustomize feature, so we patch the configmap where params.env is stored
        #  approach would be the same with the current replacements feature
        # https://github.com/opendatahub-io/odh-dashboard/blob/0da3abf2c5256bd5c0ed8e69d3c0da5a563f8caa/manifests/rhoai/onprem/kustomization.yaml#L9C1-L13C30
        - target:
              kind: ConfigMap
              name: rhoai-dashboard-params
          patch: |-
            - op: replace
              path: /data/odh-dashboard-image
              value: quay.io/opendatahub/odh-dashboard:v2.37.1-odh
        - patch: |-
            - op: add
              path: /rules/-
              value:
                apiGroups:
                - rbac.authorization.k8s.io
                resources:
                - roles
                - rolebindings
                verbs:
                - create
          target:
            kind: ClusterRole
            name: rhods-dashboard
      # https://github.com/red-hat-data-services/odh-dashboard/blob/131c0da21d6434af027634e861a157f2a501af78/Dockerfile.konflux#L24-L28
#      patches:
#        # add / replace / remove
#        - patch: |-
#            - op: replace
#              path: /spec/template/spec/containers/0/env
#              value:
#                  - name: IMAGE_REPO
#                    value: quay.io/jdanek/odh-dashboard
#                  - name: ODH_PRODUCT_NAME
#                    value: "Red Hat OpenShift AI"
#                  - name: DOC_LINK
#                    value: "https://docs.redhat.com/en/documentation/red_hat_openshift_ai/"
#                  - name: SUPPORT_LINK
#                    value: "https://access.redhat.com/support/cases/#/case/new/open-case?caseCreate=true"
#                  - name: COMMUNITY_LINK
#                    value: ""
#          target:
#            kind: Deployment
#            name: rhods-dashboard
      images:
        # - registry.redhat.io/openshift4/ose-oauth-proxy=quay.io/jdanek/origin-oauth-proxy:latest
        # when there's digest, we must specify full digest, how annoying, see patch above
        - registry.redhat.io/openshift4/ose-oauth-proxy-rhel9@sha256:ca21e218e26c46e3c63d926241846f8f307fd4a586cc4b04147da49af6018ef5=quay.io/jdanek/origin-oauth-proxy:latest
        - registry.redhat.io/openshift4/ose-oauth-proxy@sha256:4f8d66597feeb32bb18699326029f9a71a5aca4a57679d636b876377c2e95695=quay.io/jdanek/origin-oauth-proxy:latest
#        - quay.io/opendatahub/odh-dashboard=quay.io/opendatahub/odh-dashboard:v2.38.2-odh
        - quay.io/opendatahub/odh-dashboard=quay.io/opendatahub/odh-dashboard:v2.37.1-odh
      replicas:
        - name: rhods-dashboard
          count: 1
---
kind: Secret
apiVersion: v1
metadata:
  name: dashboard-oauth-client-generated
  namespace: redhat-ods-applications
  labels:
    app: rhods-dashboard
    app.kubernetes.io/part-of: rhods-dashboard
    app.opendatahub.io/rhods-dashboard: 'true'
data:
  secret: ODlFc0g0ckNsRVRETFZRN0VjaWlSUlBBbkxMY2pUMnU=
type: Opaque
---
kind: Secret
apiVersion: v1
metadata:
  name: dashboard-oauth-config-generated
  namespace: redhat-ods-applications
  labels:
    app: rhods-dashboard
    app.kubernetes.io/part-of: rhods-dashboard
    app.opendatahub.io/rhods-dashboard: 'true'
data:
  cookie_secret: WTB4TlVXZGFPWGRqZDJwd01pdFJaa2wxVlZvM2R6MDk=
type: Opaque
---
# https://gateway-api.sigs.k8s.io/guides/tls/
# https://istio.io/latest/docs/tasks/traffic-management/ingress/ingress-sni-passthrough/
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: rhods-dashboard
  namespace: redhat-ods-applications
spec:
  parentRefs:
    - name: gateway
      namespace: istio-system
  hostnames: [ "rhods-dashboard.127.0.0.1.sslip.io" ]
  rules:
    - backendRefs:
        - name: rhods-dashboard
          port: 8443
