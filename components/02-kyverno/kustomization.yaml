---
# https://kyverno.io/docs/installation/methods/#install-kyverno-using-yamls
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kyverno
resources:
  - https://github.com/kyverno/kyverno/releases/download/v1.19.0/install.yaml

patches:
  - path: success-events-config.yaml
  # install.yaml bakes in `--omitEvents=PolicyApplied,PolicySkipped` on these 3 controllers, which
  # silently overrides the ConfigMap's generateSuccessEvents/successEventActions above (confirmed by
  # a "generateSuccessEvents is enabled but PolicyApplied is in omitEvents" log warning otherwise).
  # Appending a second --omitEvents wins: Kyverno v1.19.0 registers it with Go's standard
  # flag.FlagSet.StringVar in all three controllers, so repeated values overwrite earlier ones - see
  # https://github.com/kyverno/kyverno/blob/v1.19.0/cmd/kyverno/main.go#L397,
  # cmd/background-controller/main.go#L146, cmd/reports-controller/main.go#L323). Appending avoids
  # depending on the flag's position in the args array, which shifts across version bumps -
  # cleanup-controller has no --omitEvents flag at all, so it's not patched here.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --omitEvents=PolicySkipped
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kyverno-admission-controller
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --omitEvents=PolicySkipped
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kyverno-background-controller
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --omitEvents=PolicySkipped
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kyverno-reports-controller
  # Kyverno's admission-controller caches the cluster's CRD -> GVR mapping and only refreshes it every
  # --resyncPeriod (15m default) unless --crdWatcher=true starts an informer that invalidates the cache
  # immediately on CRD add/update/delete (kyverno/kyverno#10729, fixed by kyverno/kyverno#13141, but
  # off by default even in v1.19.0 - it's a helm-chart-only opt-in, install.yaml never sets it). Without
  # this, any CRD installed *after* Kyverno starts (e.g. DataSciencePipelinesApplication, created here by
  # DSPO's ArgoCD sync partway through deploy.py) can 404 out of admission for up to 15 minutes with
  # "admission webhook ... denied the request: resource X not found in group Y" - confirmed live in CI,
  # this made the Dashboard's "Configure pipeline server" action fail outright for force-dspa-pipelinestore-database.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --crdWatcher=true
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kyverno-admission-controller
  # The crdWatcher informer needs list/watch on customresourcedefinitions; install.yaml's aggregated
  # ClusterRole only grants `get` (matching the Helm chart's default crdWatcher: false RBAC).
  - patch: |-
      - op: add
        path: /rules/0/verbs/-
        value: list
      - op: add
        path: /rules/0/verbs/-
        value: watch
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: kyverno:admission-controller:core
  # Native OTLP tracing, gated behind --enableTracing (confirmed in kyverno v1.19.0 source,
  # cmd/internal/{flag,tracing}.go - all 4 controllers wire this up via internal.WithTracing()/
  # internal.SetupTracing()). tracingAddress+tracingPort are joined as host:port (net.JoinHostPort)
  # with no scheme prefix; empty tracingCreds means an insecure connection, matching the
  # plaintext-OTLP collector these point at.
  #
  # Points at components/14-otel-collector's otel-collector-gateway Service (in-cluster DNS -
  # Kyverno pods are on the regular pod network with working CoreDNS, confirmed live, so no
  # pinned-IP workaround is needed here unlike kube-apiserver's hostNetwork static pod - see
  # components/13-apiserver-tracing/apiserver-tracing.yaml). This already works today - confirmed
  # live (2026-08-30): a real, correlated distributed trace with both a
  # "kyverno-admission-controller: POST" root span and an "apiserver: PUT .../leases/{:name}"
  # child span showed up in Aspire from a lease-renewal call. Routed through the gateway (rather
  # than straight to Aspire) so its tail_sampling processor sees every participant of traces like
  # that one and can make one consistent keep/drop decision instead of the two ends disagreeing.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enableTracing=true
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --tracingAddress=otel-collector-gateway.otel-collector.svc.cluster.local
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --tracingPort=4317
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kyverno-admission-controller
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enableTracing=true
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --tracingAddress=otel-collector-gateway.otel-collector.svc.cluster.local
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --tracingPort=4317
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kyverno-background-controller
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enableTracing=true
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --tracingAddress=otel-collector-gateway.otel-collector.svc.cluster.local
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --tracingPort=4317
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kyverno-reports-controller
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enableTracing=true
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --tracingAddress=otel-collector-gateway.otel-collector.svc.cluster.local
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --tracingPort=4317
    target:
      group: apps
      version: v1
      kind: Deployment
      name: kyverno-cleanup-controller
