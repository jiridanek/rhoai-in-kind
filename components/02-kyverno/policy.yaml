---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: sync-ca-configmap
  annotations:
    policies.kyverno.io/title: Synchronize CA ConfigMap to all Namespaces
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/subject: ConfigMap
    policies.kyverno.io/description: >-
      This policy creates a copy of a central CA ConfigMap in all existing
      and new namespaces. This ensures that all workloads can easily mount
      and trust a common cluster-wide CA.
spec:
  evaluation:
    # Add the resource to existing namespaces (generateExisting) and keep it in sync (synchronize).
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: source
      expression: resource.Get("v1", "configmaps", "cert-manager", "odh-trusted-ca-bundle")
  generate:
    - expression: >-
        generator.Apply(variables.nsName, [variables.source])
---
# We need to add openshift-service-ca.crt configmap to every namespace,
# the way it would happen on OpenShift. Otherwise DSPA does not reconcile.

apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: openshift-like-sa-cm
spec:
  evaluation:
    # https://kyverno.io/docs/policy-types/generating-policy/ - retroactively generate for existing namespaces too.
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
  variables:
    - name: nsName
      expression: object.metadata.name
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: openshift-service-ca.crt
            namespace: (( variables.nsName ))
            annotations:
              service.beta.openshift.io/inject-cabundle: "true"
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: openshift-like-volume-mounts
spec:
  # Legacy ClusterPolicy only matched bare Pods (no pod-controller autogen annotation); MutatingPolicy
  # autogenerates variant rules for Deployment/StatefulSet/Job/CronJob pod templates by default, but our
  # CEL expressions assume a Pod-shaped `object` (object.spec.containers) and error on those autogenerated
  # variants ("no such key: containers", since e.g. Deployment.spec has no top-level `containers`).
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        opendatahub.io/dashboard: "true"
  variables:
    - name: volumeMount
      expression: >-
        {
          "name": dyn("service-ca-kube-api-access"),
          "readOnly": dyn(true),
          "mountPath": dyn("/var/run/secrets/kubernetes.io/serviceaccount")
        }
    - name: volume
      expression: >-
        {
          "name": dyn("service-ca-kube-api-access"),
          "projected": dyn({
            "sources": dyn([
              {"serviceAccountToken": dyn({"expirationSeconds": dyn(3607), "path": dyn("token")})},
              {"configMap": dyn({"name": dyn("kube-root-ca.crt"), "items": dyn([{"key": dyn("ca.crt"), "path": dyn("ca.crt")}])})},
              {"downwardAPI": dyn({"items": dyn([{"path": dyn("namespace"), "fieldRef": dyn({"apiVersion": dyn("v1"), "fieldPath": dyn("metadata.namespace")})}])})},
              {"configMap": dyn({"name": dyn("openshift-service-ca.crt"), "items": dyn([{"key": dyn("service-ca.crt"), "path": dyn("service-ca.crt")}])})}
            ]),
            "defaultMode": dyn(420)
          })
        }
  mutations:
    # https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
    # JSONPatch (not ApplyConfiguration) because the deeply-nested projected-volume-source fields are
    # k8s API atomic lists/structs, which ApplyConfiguration's structured merge rejects outright
    # ("may not mutate atomic arrays, maps or structs") even for a brand-new volume with no prior owner.
    # `(name): "*"` (legacy wildcard anchor) becomes an explicit `map()` producing one add-op per
    # container/initContainer, appending or creating the volumeMounts array as needed.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          object.spec.containers.map(c,
            JSONPatch{
              op: "add",
              path: has(c.volumeMounts)
                ? "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/volumeMounts/-"
                : "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/volumeMounts",
              value: has(c.volumeMounts) ? variables.volumeMount : dyn([variables.volumeMount])
            }
          )
          +
          object.spec.?initContainers.orValue([]).map(c,
            JSONPatch{
              op: "add",
              path: has(c.volumeMounts)
                ? "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/volumeMounts/-"
                : "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/volumeMounts",
              value: has(c.volumeMounts) ? variables.volumeMount : dyn([variables.volumeMount])
            }
          )
          +
          [
            JSONPatch{
              op: "add",
              path: has(object.spec.volumes) ? "/spec/volumes/-" : "/spec/volumes",
              value: has(object.spec.volumes) ? variables.volume : dyn([variables.volume])
            }
          ]

---

# We are very tight on system resources, it is necessary to make our containers BestEffort

# https://kubernetes.io/docs/tasks/configure-pod-container/quality-service-pod/#create-a-pod-that-gets-assigned-a-qos-class-of-besteffort

