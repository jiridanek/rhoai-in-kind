---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: sync-ca-configmap
  annotations:
    policies.kyverno.io/title: Synchronize CA ConfigMap to all Namespaces
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/subject: ConfigMap
    policies.kyverno.io/description: >-
      This policy creates a copy of a central CA ConfigMap in all existing
      and new namespaces. This ensures that all workloads can easily mount
      and trust a common cluster-wide CA.
spec:
  evaluation:
    # Add the resource to existing namespaces (generateExisting) and keep it in sync (synchronize).
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: source
      expression: resource.Get("v1", "configmaps", "cert-manager", "odh-trusted-ca-bundle")
  generate:
    - expression: >-
        generator.Apply(variables.nsName, [variables.source])
---
# We need to add openshift-service-ca.crt configmap to every namespace,
# the way it would happen on OpenShift. Otherwise DSPA does not reconcile.

apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: openshift-like-sa-cm
spec:
  evaluation:
    # https://kyverno.io/docs/policy-types/generating-policy/ - retroactively generate for existing namespaces too.
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
  variables:
    - name: nsName
      expression: object.metadata.name
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: openshift-service-ca.crt
            namespace: (( variables.nsName ))
            annotations:
              service.beta.openshift.io/inject-cabundle: "true"
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: openshift-like-volume-mounts
spec:
  # Legacy ClusterPolicy only matched bare Pods (no pod-controller autogen annotation); MutatingPolicy
  # autogenerates variant rules for Deployment/StatefulSet/Job/CronJob pod templates by default, but our
  # CEL expressions assume a Pod-shaped `object` (object.spec.containers) and error on those autogenerated
  # variants ("no such key: containers", since e.g. Deployment.spec has no top-level `containers`).
  #
  # namespaceSelector uses our own rhoai-in-kind.io/inject-openshift-ca label, NOT the Dashboard's
  # opendatahub.io/dashboard label (which used to be reused here) - the Dashboard filters its "Data
  # Science Projects" list on that exact label, so reusing it here would make any namespace we label
  # for CA injection (e.g. redhat-ods-applications, needed to fix #89's MinIO TLS trust failure) show
  # up as a fake "project" (#90). The propagate-ca-injection-label policy below keeps this label in
  # sync with opendatahub.io/dashboard for namespaces that legitimately have both.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        rhoai-in-kind.io/inject-openshift-ca: "true"
  variables:
    - name: saMountPath
      expression: '"/var/run/secrets/kubernetes.io/serviceaccount"'
    # Real fix for #89: mounting a CA file alone does nothing for Go/Python HTTPS clients unless
    # something also points them at it - SSL_CERT_FILE is the standard Go crypto/x509 env override
    # (also respected by Python's ssl/requests via OpenSSL). combined-ca-bundle.crt (built by
    # certs.py's ca_issuer()) is the system CA bundle with "My Cluster CA" appended, so trust for
    # both the public internet (pip/git/registries) and *.apps.127.0.0.1.sslip.io (MinIO, DSPA, ...)
    # come from one file. Verified live: `openshift-service-ca.crt` (mounted here previously) is a
    # dummy self-signed cert from a fake "openshift-service-serving-signer" - unrelated to the actual
    # CA that signs *.apps.127.0.0.1.sslip.io, so it could never have fixed any TLS trust problem;
    # and no env var was ever set to make any consumer read either file in the first place.
    - name: caBundlePath
      expression: variables.saMountPath + "/combined-ca-bundle.crt"
    - name: volumeMount
      expression: >-
        {
          "name": dyn("service-ca-kube-api-access"),
          "readOnly": dyn(true),
          "mountPath": dyn(variables.saMountPath)
        }
    - name: sslCertFileEnvVar
      expression: >-
        {
          "name": dyn("SSL_CERT_FILE"),
          "value": dyn(variables.caBundlePath)
        }
    # `odh-trusted-ca-bundle`'s configMap source below is marked optional: true - sync-ca-configmap's
    # GeneratingPolicy creates it in reaction to the Namespace CREATE event, so it can lag a few
    # seconds behind; without `optional`, kubelet's MountVolume.SetUp hard-fails with "configmap ...
    # not found" and blocks the pod forever (confirmed live in CI: broke mariadb-dspa, which then
    # blocked DSPA's "at least 7 pods running" check for the whole test). A pod that races and starts
    # before the configmap exists just runs without the mounted CA/SSL_CERT_FILE trust for its
    # lifetime - acceptable, since the pod that actually needs it (DSPO) is created via ArgoCD sync
    # well after redhat-ods-applications' namespace creation and CA sync have both long settled.
    - name: volume
      expression: >-
        {
          "name": dyn("service-ca-kube-api-access"),
          "projected": dyn({
            "sources": dyn([
              {"serviceAccountToken": dyn({"expirationSeconds": dyn(3607), "path": dyn("token")})},
              {"configMap": dyn({"name": dyn("kube-root-ca.crt"), "items": dyn([{"key": dyn("ca.crt"), "path": dyn("ca.crt")}])})},
              {"downwardAPI": dyn({"items": dyn([{"path": dyn("namespace"), "fieldRef": dyn({"apiVersion": dyn("v1"), "fieldPath": dyn("metadata.namespace")})}])})},
              {"configMap": dyn({"name": dyn("openshift-service-ca.crt"), "items": dyn([{"key": dyn("service-ca.crt"), "path": dyn("service-ca.crt")}])})},
              {"configMap": dyn({"name": dyn("odh-trusted-ca-bundle"), "optional": dyn(true), "items": dyn([{"key": dyn("combined-ca-bundle.crt"), "path": dyn("combined-ca-bundle.crt")}])})}
            ]),
            "defaultMode": dyn(420)
          })
        }
  mutations:
    # https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
    # JSONPatch (not ApplyConfiguration) because the deeply-nested projected-volume-source fields are
    # k8s API atomic lists/structs, which ApplyConfiguration's structured merge rejects outright
    # ("may not mutate atomic arrays, maps or structs") even for a brand-new volume with no prior owner.
    # `(name): "*"` (legacy wildcard anchor) becomes an explicit `map()` producing one op per container/initContainer.
    # IMPORTANT: Kubernetes' own strategic-merge-patch key for Container.volumeMounts is `mountPath`, not
    # `name` - so the legacy patchStrategicMerge silently REPLACED the default service-account-token mount
    # (which every Pod gets unless automountServiceAccountToken: false) rather than adding a second entry
    # at the same path. A plain JSONPatch "add" doesn't get that merge-key behavior for free and instead
    # creates a real duplicate, which the apiserver's own Pod validation rejects with "must be unique"
    # (confirmed live: this broke every notebook Pod in CI). Replicate the merge-by-mountPath explicitly:
    # if a volumeMount at our target path already exists, "replace" it in place; otherwise append/create.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          object.spec.containers.map(c,
            (has(c.volumeMounts) && c.volumeMounts.exists(vm, vm.mountPath == variables.saMountPath))
              ? JSONPatch{
                  op: "replace",
                  path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/volumeMounts/" + string(c.volumeMounts.map(vm, vm.mountPath).indexOf(variables.saMountPath)),
                  value: variables.volumeMount
                }
              : has(c.volumeMounts)
                ? JSONPatch{op: "add", path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/volumeMounts/-", value: variables.volumeMount}
                : JSONPatch{op: "add", path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/volumeMounts", value: dyn([variables.volumeMount])}
          )
          +
          object.spec.?initContainers.orValue([]).map(c,
            (has(c.volumeMounts) && c.volumeMounts.exists(vm, vm.mountPath == variables.saMountPath))
              ? JSONPatch{
                  op: "replace",
                  path: "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/volumeMounts/" + string(c.volumeMounts.map(vm, vm.mountPath).indexOf(variables.saMountPath)),
                  value: variables.volumeMount
                }
              : has(c.volumeMounts)
                ? JSONPatch{op: "add", path: "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/volumeMounts/-", value: variables.volumeMount}
                : JSONPatch{op: "add", path: "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/volumeMounts", value: dyn([variables.volumeMount])}
          )
          +
          [
            JSONPatch{
              op: "add",
              path: has(object.spec.volumes) ? "/spec/volumes/-" : "/spec/volumes",
              value: has(object.spec.volumes) ? variables.volume : dyn([variables.volume])
            }
          ]
          +
          object.spec.containers.map(c,
            (has(c.env) && c.env.exists(e, e.name == "SSL_CERT_FILE"))
              ? JSONPatch{
                  op: "replace",
                  path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/env/" + string(c.env.map(e, e.name).indexOf("SSL_CERT_FILE")),
                  value: variables.sslCertFileEnvVar
                }
              : has(c.env)
                ? JSONPatch{op: "add", path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/env/-", value: variables.sslCertFileEnvVar}
                : JSONPatch{op: "add", path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/env", value: dyn([variables.sslCertFileEnvVar])}
          )
          +
          object.spec.?initContainers.orValue([]).map(c,
            (has(c.env) && c.env.exists(e, e.name == "SSL_CERT_FILE"))
              ? JSONPatch{
                  op: "replace",
                  path: "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/env/" + string(c.env.map(e, e.name).indexOf("SSL_CERT_FILE")),
                  value: variables.sslCertFileEnvVar
                }
              : has(c.env)
                ? JSONPatch{op: "add", path: "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/env/-", value: variables.sslCertFileEnvVar}
                : JSONPatch{op: "add", path: "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/env", value: dyn([variables.sslCertFileEnvVar])}
          )
---
# Keeps rhoai-in-kind.io/inject-openshift-ca in sync with opendatahub.io/dashboard, so namespaces
# that ods-ci/the Dashboard label as Data Science Projects (Projects.resource's
# `oc label namespace ... opendatahub.io/dashboard=true`) automatically get CA-bundle injection too,
# without reusing the Dashboard's own label as the injection policy's selector (see #90).
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: propagate-ca-injection-label
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: needs-injection-label
      expression: >-
        object.metadata.?labels.orValue({})[?"opendatahub.io/dashboard"].orValue("") == "true" &&
        object.metadata.?labels.orValue({})[?"rhoai-in-kind.io/inject-openshift-ca"].orValue("") != "true"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              labels: {"rhoai-in-kind.io/inject-openshift-ca": dyn("true")}
            }
          }

---

# We are very tight on system resources, it is necessary to make our containers BestEffort

# https://kubernetes.io/docs/tasks/configure-pod-container/quality-service-pod/#create-a-pod-that-gets-assigned-a-qos-class-of-besteffort

