# https://kyverno.io/docs/writing-policies/mutate/
# Also, mutations using patchesJson6902 to Pods directly are not converted to higher-level controllers such as Deployments and StatefulSets through the use of the auto-gen feature.
# Therefore, when writing such mutation rules for Pods,
# it may be necessary to create multiple rules to cover all relevant Pod controllers.

apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: remove-cpu-memory-requests
  annotations:
    policies.kyverno.io/title: Remove CPU and Memory Requests
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Removes the `requests` field for both CPU and memory from the `resources`
      section of all containers in incoming workloads, cluster-wide (intentionally
      NOT scoped to opendatahub.io/dashboard namespaces - system pods like
      rhods-dashboard need this too to fit the small kind CI node's CPU budget).
spec:
  # See openshift-like-volume-mounts above: disable autogen since our CEL expressions assume a
  # Pod-shaped `object`, which autogenerated Deployment/StatefulSet/etc. variants don't have.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        # override any updates from controller/statefulset
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    # containers and initContainers need identical treatment, just under a different /spec/<kind>
    # path prefix - iterate both through one shared expression below instead of duplicating it.
    - name: containerGroups
      expression: >-
        [
          {"kind": dyn("containers"), "list": dyn(object.spec.containers)},
          {"kind": dyn("initContainers"), "list": dyn(object.spec.?initContainers.orValue([]))}
        ]
  mutations:
    # https://github.com/kyverno/kyverno/issues/1713#issuecomment-2430854013
    # "remove" errors if its target is absent and "add" errors if an intermediate parent object
    # (resources/requests) is absent; with the default failurePolicy: Fail either would reject the
    # whole Pod admission, so every op below is conditioned on the field actually being present.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          variables.containerGroups.map(g, g.list.map(c, [
            (has(c.resources) && has(c.resources.requests) && has(c.resources.requests.cpu))
              ? [JSONPatch{op: "remove", path: "/spec/" + g.kind + "/" + string(g.list.indexOf(c)) + "/resources/requests/cpu"}] : [],
            (has(c.resources) && has(c.resources.limits) && has(c.resources.limits.cpu))
              ? [JSONPatch{op: "remove", path: "/spec/" + g.kind + "/" + string(g.list.indexOf(c)) + "/resources/limits/cpu"}] : [],
            !has(c.resources)
              ? [JSONPatch{op: "add", path: "/spec/" + g.kind + "/" + string(g.list.indexOf(c)) + "/resources", value: dyn({"requests": {"memory": "0"}})}]
              : !has(c.resources.requests)
                ? [JSONPatch{op: "add", path: "/spec/" + g.kind + "/" + string(g.list.indexOf(c)) + "/resources/requests", value: dyn({"memory": "0"})}]
                : [JSONPatch{op: "add", path: "/spec/" + g.kind + "/" + string(g.list.indexOf(c)) + "/resources/requests/memory", value: "0"}]
          ].flatten()).flatten()).flatten()
