apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # NOTE: pipelines-routes-policy.yaml defines its own, differently-scoped
  # kyverno-pipeline-route-manager ClusterRole under a distinct name. These two files used
  # to define a ClusterRole with the SAME name ("kyverno-route-tlsroute-manager") but
  # different, non-overlapping rule sets - `kubectl apply` on either file silently clobbered
  # the other's RBAC grants (no merging across files for a same-named cluster-scoped object),
  # since a ClusterRole isn't a Kustomize/Kyverno concept, just a plain resource whose whole
  # object gets replaced by the last apply. Confirmed live in #95's investigation: this caused
  # kyverno-background-controller to lose "get/create destinationrules"/"get/create httproutes"
  # permissions whenever notebook-routes-policy.yaml was applied after pipelines-routes-policy.yaml,
  # breaking DSPA's DestinationRule/HTTPRoute generation with "... is forbidden: User
  # \"system:serviceaccount:kyverno:kyverno-background-controller\" cannot get resource ...".
  # Distinct names per file avoid the collision entirely.
  name: kyverno-notebook-route-manager
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - tlsroutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-bind-notebook-route-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-notebook-route-manager
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
  - kind: ServiceAccount
    name: kyverno-reports-controller
    namespace: kyverno
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-tlsroute-for-notebook
  annotations:
    policies.kyverno.io/title: Generate TLSRoute for Notebooks
    policies.kyverno.io/category: Gateway API, OpenShiftAI
    policies.kyverno.io/subject: Route, TLSRoute
    policies.kyverno.io/description: >-
      When an OpenShift Route for an OpenShiftAI Notebook is created, this policy generates
      a corresponding TLSRoute attaching to a predefined Gateway, using a predictable
      hostname format (<notebook-name>-<namespace>.127.0.0.1.sslip.io). Requires the
      Gateway API CRDs and a target Gateway to exist.
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      # UPDATE is required, not just CREATE: the companion update-route-host-for-notebook
      # MutatingPolicy below always fires an UPDATE on the Route right after DSPO/the notebook
      # controller creates it (to set spec.host, since the Route is created with an empty
      # host). With synchronize: true and only CREATE listed here, Kyverno's background
      # controller re-evaluates this GeneratingPolicy's match on that very next UPDATE event,
      # decides its own trigger "no longer matches" (operations: ["CREATE"] doesn't cover
      # UPDATE), and immediately deletes the TLSRoute it just generated - permanently, since
      # no further CREATE ever happens for that Route. Confirmed live: without "UPDATE" here,
      # the TLSRoute is generated then torn down within the same second, every time.
      - apiGroups: ["route.openshift.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["routes"]
  matchConditions:
    - name: has-notebook-owner
      expression: >-
        object.metadata.?ownerReferences.orValue([]).exists(r, r.kind == 'Notebook')
    - name: has-notebook-name-label
      expression: >-
        object.metadata.?labels['notebook-name'].orValue('') != ''
  variables:
    - name: nsName
      expression: object.metadata.namespace
    - name: name
      expression: object.metadata.name
    - name: hostname
      # USE THE SAME HOSTNAME FORMAT IN THE GENERATED TLSROUTE AND THE ROUTE
      # https://github.com/kyverno/kyverno/issues/4206
      expression: object.metadata.labels['notebook-name'] + '-' + object.metadata.namespace + '.127.0.0.1.sslip.io'
    - name: backendName
      expression: object.spec.to.name
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: gateway.networking.k8s.io/v1alpha2
          kind: TLSRoute
          metadata:
            name: (( variables.name ))
            namespace: (( variables.nsName ))
            ownerReferences: (( object.metadata.ownerReferences ))
          spec:
            parentRefs:
              - name: gateway
                namespace: istio-system
            hostnames:
              - (( variables.hostname ))
            rules:
              - backendRefs:
                  - name: (( variables.backendName ))
                    kind: Service
                    port: 443 # routes and tlsroutes may differ whether named ports are allowed
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: update-route-host-for-notebook
  annotations:
    policies.kyverno.io/title: Update Route Hostname for Notebooks
    policies.kyverno.io/category: Gateway API, OpenShiftAI
    policies.kyverno.io/subject: Route
    policies.kyverno.io/description: >-
      Updates a Notebook's Route spec.host field, using the same predictable hostname
      format as the generate-tlsroute-for-notebook policy's generated TLSRoute.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["route.openshift.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["routes"]
  matchConditions:
    - name: host-empty
      expression: object.spec.?host.orValue('') == ''
    - name: has-notebook-owner
      expression: >-
        object.metadata.?ownerReferences.orValue([]).exists(r, r.kind == 'Notebook')
    - name: has-notebook-name-label
      expression: >-
        object.metadata.?labels['notebook-name'].orValue('') != ''
  variables:
    - name: hostname
      # *** USE THE SAME PREDICTABLE HOSTNAME PATTERN AS THE GENERATED TLSROUTE ***
      expression: object.metadata.labels['notebook-name'] + '-' + object.metadata.namespace + '.127.0.0.1.sslip.io'
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              host: variables.hostname
            }
          }
