apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-route-tlsroute-manager
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - tlsroutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - networking.istio.io
    resources:
      - destinationrules
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-bind-route-tlsroute-manager-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-route-tlsroute-manager
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
  - kind: ServiceAccount
    name: kyverno-reports-controller
    namespace: kyverno
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-backendtls-for-service
  annotations:
    policies.kyverno.io/title: Generate DestinationRule for Pipelines Service
    policies.kyverno.io/category: Gateway API, OpenShiftAI
    policies.kyverno.io/subject: Service, DestinationRule
    policies.kyverno.io/description: >-
      When a Service for a DataSciencePipelinesApplication is created, this policy generates
      a DestinationRule disabling TLS validation, since the pipelines API server's certificate
      isn't trusted by the mesh by default.
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["services"]
  matchConditions:
    - name: has-dspa-owner
      expression: >-
        object.metadata.?ownerReferences.orValue([]).exists(r, r.kind == 'DataSciencePipelinesApplication')
    - name: has-app-label
      expression: object.metadata.?labels['app'].orValue('') != ''
  variables:
    - name: nsName
      expression: object.metadata.namespace
    - name: name
      expression: object.metadata.name
  generate:
    # Two options here
    # * BackendTLSPolicy and provide correct cert
    # * DestinationRule (istio specific) and disable TLS validation

    # DestinationRule option
    - template:
        interpolate: cel
        value: |
          apiVersion: networking.istio.io/v1beta1
          kind: DestinationRule
          metadata:
            name: (( variables.name ))
            namespace: (( variables.nsName ))
          spec:
            host: (( variables.name + '.' + variables.nsName + '.svc.cluster.local' ))
            trafficPolicy:
              tls:
                mode: SIMPLE
                insecureSkipVerify: true
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-httproute-for-pipeline
  annotations:
    policies.kyverno.io/title: Generate HTTPRoute for Pipelines
    policies.kyverno.io/category: Gateway API, OpenShiftAI
    policies.kyverno.io/subject: Route, HTTPRoute
    policies.kyverno.io/description: >-
      When an OpenShift Route for a DataSciencePipelinesApplication is created, this policy
      generates a corresponding HTTPRoute attaching to a predefined Gateway, using a predictable
      hostname format (<app-label>-<namespace>.apps.127.0.0.1.sslip.io). Requires the Gateway
      API CRDs and a target Gateway to exist.
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["route.openshift.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["routes"]
  matchConditions:
    - name: has-dspa-owner
      expression: >-
        object.metadata.?ownerReferences.orValue([]).exists(r, r.kind == 'DataSciencePipelinesApplication')
    - name: has-app-label
      expression: object.metadata.?labels['app'].orValue('') != ''
  variables:
    - name: nsName
      expression: object.metadata.namespace
    - name: name
      expression: object.metadata.name
    - name: hostname
      # USE THE SAME HOSTNAME FORMAT IN THE GENERATED TLSROUTE AND THE ROUTE
      # https://github.com/kyverno/kyverno/issues/4206
      expression: object.metadata.labels['app'] + '-' + object.metadata.namespace + '.apps.127.0.0.1.sslip.io'
    - name: backendName
      expression: object.spec.to.name
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: (( variables.name ))
            namespace: (( variables.nsName ))
            ownerReferences: (( object.metadata.ownerReferences ))
          spec:
            parentRefs:
              - name: gateway
                namespace: istio-system
                sectionName: https-terminate
            hostnames:
              - (( variables.hostname ))
            rules:
              - backendRefs:
                  - name: (( variables.backendName ))
                    kind: Service
                    port: 8443 # routes and tlsroutes may differ whether named ports are allowed
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: update-route-host-for-pipeline
  annotations:
    policies.kyverno.io/title: Update Route Hostname for Pipelines
    policies.kyverno.io/category: Gateway API, OpenShiftAI
    policies.kyverno.io/subject: Route
    policies.kyverno.io/description: >-
      Updates a DataSciencePipelinesApplication's Route spec.host field, using the same
      predictable hostname format as the generate-httproute-for-pipeline policy's generated
      HTTPRoute.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["route.openshift.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["routes"]
  matchConditions:
    - name: host-empty
      expression: object.spec.?host.orValue('') == ''
    - name: has-dspa-owner
      expression: >-
        object.metadata.?ownerReferences.orValue([]).exists(r, r.kind == 'DataSciencePipelinesApplication')
    - name: has-app-label
      expression: object.metadata.?labels['app'].orValue('') != ''
  variables:
    - name: hostname
      # *** USE THE SAME PREDICTABLE HOSTNAME PATTERN AS THE GENERATED TLSROUTE ***
      # actually, need this reachable from cluster, so 127.0.0.1 won't work
      expression: object.metadata.labels['app'] + '-' + object.metadata.namespace + '.apps.127.0.0.1.sslip.io'
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              host: variables.hostname
            }
          }
