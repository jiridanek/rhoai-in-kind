apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # NOTE: notebook-routes-policy.yaml defines its own kyverno-notebook-route-manager
  # ClusterRole under a distinct name - see the comment there for why (#95): this file and
  # that one used to share the name "kyverno-route-tlsroute-manager" with different rule
  # sets, and whichever was applied last silently clobbered the other's RBAC grants.
  name: kyverno-pipeline-route-manager
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - tlsroutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - networking.istio.io
    resources:
      - destinationrules
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-bind-pipeline-route-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-pipeline-route-manager
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
  - kind: ServiceAccount
    name: kyverno-reports-controller
    namespace: kyverno
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-backendtls-for-service
  annotations:
    policies.kyverno.io/title: Generate DestinationRule for Pipelines Service
    policies.kyverno.io/category: Gateway API, OpenShiftAI
    policies.kyverno.io/subject: Service, DestinationRule
    policies.kyverno.io/description: >-
      When a Service for a DataSciencePipelinesApplication is created, this policy generates
      a DestinationRule disabling TLS validation, since the pipelines API server's certificate
      isn't trusted by the mesh by default.
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      # UPDATE is required, not just CREATE (see the matching comment on
      # generate-httproute-for-pipeline below, and issue #95): DSPO re-applies/patches its
      # owned Services during normal reconciliation shortly after creating them. With
      # synchronize: true and only CREATE listed here, that very next UPDATE makes Kyverno's
      # background controller decide this policy's trigger "no longer matches" and delete the
      # DestinationRule it just generated - permanently, since no further CREATE ever happens
      # for that Service. Confirmed live: without a DestinationRule, mTLS from the gateway to
      # the pipelines API server fails, breaking Elyra pipeline submission entirely.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  matchConditions:
    - name: has-dspa-owner
      expression: >-
        object.metadata.?ownerReferences.orValue([]).exists(r, r.kind == 'DataSciencePipelinesApplication')
    - name: has-app-label
      expression: object.metadata.?labels['app'].orValue('') != ''
  variables:
    - name: nsName
      expression: object.metadata.namespace
    - name: name
      expression: object.metadata.name
  generate:
    # Two options here
    # * BackendTLSPolicy and provide correct cert
    # * DestinationRule (istio specific) and disable TLS validation

    # DestinationRule option
    - template:
        interpolate: cel
        value: |
          apiVersion: networking.istio.io/v1beta1
          kind: DestinationRule
          metadata:
            name: (( variables.name ))
            namespace: (( variables.nsName ))
          spec:
            host: (( variables.name + '.' + variables.nsName + '.svc.cluster.local' ))
            trafficPolicy:
              tls:
                mode: SIMPLE
                insecureSkipVerify: true
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-httproute-for-pipeline
  annotations:
    policies.kyverno.io/title: Generate HTTPRoute for Pipelines
    policies.kyverno.io/category: Gateway API, OpenShiftAI
    policies.kyverno.io/subject: Route, HTTPRoute
    policies.kyverno.io/description: >-
      When an OpenShift Route for a DataSciencePipelinesApplication is created, this policy
      generates a corresponding HTTPRoute attaching to a predefined Gateway, using a predictable
      hostname format (<app-label>-<namespace>.apps.127.0.0.1.sslip.io). Requires the Gateway
      API CRDs and a target Gateway to exist.
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      # UPDATE is required, not just CREATE (root cause of #95's Elyra pipeline-submission
      # failure): the update-route-host-for-pipeline MutatingPolicy below always fires an
      # UPDATE on the Route right after DSPO creates it (to set spec.host, since DSPO creates
      # the Route with an empty host). With synchronize: true and only CREATE listed here,
      # Kyverno's background controller re-evaluates this GeneratingPolicy's match on that very
      # next UPDATE event, decides its own trigger "no longer matches" (operations: ["CREATE"]
      # doesn't cover UPDATE), and immediately deletes the HTTPRoute it just generated -
      # permanently, since no further CREATE ever happens for that Route. Confirmed live: the
      # HTTPRoute is generated then torn down within the same second, every time, leaving the
      # pipelines API server completely unroutable (any request 404s at the gateway) - which is
      # what actually broke Elyra's kfp.Client() in #95, not the URL's missing "/pipeline"
      # suffix that its error message misleadingly suggests.
      - apiGroups: ["route.openshift.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["routes"]
  matchConditions:
    - name: has-dspa-owner
      expression: >-
        object.metadata.?ownerReferences.orValue([]).exists(r, r.kind == 'DataSciencePipelinesApplication')
    - name: has-app-label
      expression: object.metadata.?labels['app'].orValue('') != ''
  variables:
    - name: nsName
      expression: object.metadata.namespace
    - name: name
      expression: object.metadata.name
    - name: hostname
      # USE THE SAME HOSTNAME FORMAT IN THE GENERATED TLSROUTE AND THE ROUTE
      # https://github.com/kyverno/kyverno/issues/4206
      expression: object.metadata.labels['app'] + '-' + object.metadata.namespace + '.apps.127.0.0.1.sslip.io'
    - name: backendName
      expression: object.spec.to.name
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: (( variables.name ))
            namespace: (( variables.nsName ))
            ownerReferences: (( object.metadata.ownerReferences ))
          spec:
            parentRefs:
              - name: gateway
                namespace: istio-system
                sectionName: https-terminate
            hostnames:
              - (( variables.hostname ))
            rules:
              - backendRefs:
                  - name: (( variables.backendName ))
                    kind: Service
                    port: 8443 # routes and tlsroutes may differ whether named ports are allowed
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: update-route-host-for-pipeline
  annotations:
    policies.kyverno.io/title: Update Route Hostname for Pipelines
    policies.kyverno.io/category: Gateway API, OpenShiftAI
    policies.kyverno.io/subject: Route
    policies.kyverno.io/description: >-
      Updates a DataSciencePipelinesApplication's Route spec.host field, using the same
      predictable hostname format as the generate-httproute-for-pipeline policy's generated
      HTTPRoute.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["route.openshift.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["routes"]
  matchConditions:
    - name: host-empty
      expression: object.spec.?host.orValue('') == ''
    - name: has-dspa-owner
      expression: >-
        object.metadata.?ownerReferences.orValue([]).exists(r, r.kind == 'DataSciencePipelinesApplication')
    - name: has-app-label
      expression: object.metadata.?labels['app'].orValue('') != ''
  variables:
    - name: hostname
      # *** USE THE SAME PREDICTABLE HOSTNAME PATTERN AS THE GENERATED TLSROUTE ***
      # actually, need this reachable from cluster, so 127.0.0.1 won't work
      expression: object.metadata.labels['app'] + '-' + object.metadata.namespace + '.apps.127.0.0.1.sslip.io'
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              host: variables.hostname
            }
          }
