# DSPA's `pipelineStore: kubernetes` mode (the Dashboard's "Create pipeline server"
# checkbox, checked by default since opendatahub-io/odh-dashboard#4484) breaks Elyra
# pipelines two independent ways:
#   1. Generic pipeline components fail immediately with "No minio credentials
#      provider can be initialised for current configs." - S3/COS credential
#      injection doesn't reach the pipeline step pod for KUBERNETES_SECRET auth
#      in this mode.
#   2. Elyra's "get pipeline ID by name" lookup fails outright with "Invalid input
#      error: Filter eq is not implemented for Kubernetes pipeline store. Only
#      substring is supported."
# Both are RHOAIENG-32942, already fixed upstream (kubeflow/pipelines#12189,
# cherry-picked into opendatahub-io/data-science-pipelines#202, merged 2025-08-28)
# and verified fixed in a real RHOAI 2.25 build. But the fix isn't reachable from
# this repo's pinned DSPO community tag (v2.15.1, cut 2025-08-13 - two weeks before
# the fix merged; no newer community tag exists as of this writing). `pipelineStore:
# database` (the older, MariaDB-backed mode) works correctly with the same secret.
# Force it until DSPO cuts a community release that includes the fix.
#
# Applied separately from policy.yaml's main batch, and only after DSPO's ArgoCD
# Application has synced (see deploy.py's "Install KF Pipelines" step): applying it
# any earlier races Kyverno's GVK/GVR resolution for the DataSciencePipelinesApplication
# kind, since that CRD doesn't exist until DSPO's manifests are actually synced. That
# race doesn't just fail this policy - it was observed to block the readiness wait for
# every ClusterPolicy in the earlier batch (https://github.com/jiridanek/rhoai-in-kind/pull/70).
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: force-dspa-pipelinestore-database
  annotations:
    policies.kyverno.io/title: Force DataSciencePipelinesApplication pipelineStore to database
    policies.kyverno.io/category: Data Science Pipelines
    policies.kyverno.io/subject: DataSciencePipelinesApplication
    policies.kyverno.io/description: >-
      Forces spec.apiServer.pipelineStore to "database" on every DSPA. DSPO's
      "kubernetes" pipelineStore mode (RHOAIENG-32942, fixed upstream but not yet in
      any DSPO community release) breaks Elyra pipelines: generic components fail
      with a minio-credentials error, and pipeline-run submission fails with
      "Filter eq is not implemented for Kubernetes pipeline store".
spec:
  matchConstraints:
    resourceRules:
      # Legacy ClusterPolicy matched by `kinds: [DataSciencePipelinesApplication]` alone (version-agnostic).
      # CEL's admission-time GVR resolution doesn't accept `apiVersions: ["*"]` as a real wildcard the way
      # native ValidatingWebhookConfiguration does - it errors "resource ... not found in group .../v1"
      # (confirmed live in CI: this made the Dashboard's "Configure pipeline server" fail outright with
      # that exact admission-webhook-denied error). List every version the CRD actually serves instead.
      - apiGroups: ["datasciencepipelinesapplications.opendatahub.io"]
        apiVersions: ["v1", "v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["datasciencepipelinesapplications"]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              apiServer: Object.spec.apiServer{
                pipelineStore: "database"
              }
            }
          }
