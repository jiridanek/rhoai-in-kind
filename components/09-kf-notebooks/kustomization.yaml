---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: redhat-ods-applications
resources:
  # the git urls will fail in github actions
  #- git@github.com:opendatahub-io/kubeflow.git/components/notebook-controller/config/overlays/openshift/
  #- git@github.com:opendatahub-io/kubeflow.git/components/odh-notebook-controller/config/base/

  # v1.10.0-6 (the community tag matching opendatahub-community#183's "ODH 2.35.0 ~ rhoai-2.25"
  # tracker) already contains RHOAIENG-32633 (renamed the Elyra runtime config's display_name
  # from "Data Science Pipeline" to "AI Pipeline"), which Jira targets at rhoai-3.0, not 2.25 -
  # it landed on main days before the community tag was cut, but isn't in the downstream 2.x
  # scope. Verified directly against the real downstream red-hat-data-services/kubeflow
  # `rhoai-2.25` branch: both controllers are pinned there to v1.10.0-5, and that build still
  # says "Data Science Pipeline" (matching ods-ci's release-2.25 suite).
  # https://github.com/opendatahub-io/kubeflow/releases/tag/v1.10.0-6
  # https://github.com/opendatahub-io/opendatahub-community/issues/183#issuecomment-3339632379
  # https://issues.redhat.com/browse/RHOAIENG-32633
  - https://github.com/opendatahub-io/kubeflow//components/notebook-controller/config/overlays/openshift?ref=v1.10.0-15&submodules=false
  - https://github.com/opendatahub-io/kubeflow//components/odh-notebook-controller/config/base?ref=v1.10.0-15&submodules=false
  - culler-config.yaml

patches:
  # 3.x (kubeflow v1.10.0-15+) notebook auth sidecar uses kube-rbac-proxy semantics, NOT OpenShift
  # OAuth proxy. The controller reads --kube-rbac-proxy-image (args.1) from its
  # odh-notebook-controller-image-parameters configmap (base params.env); the ODH upstream value is
  # the ODH-customized kube-auth-proxy wrapper (RHOAIENG-35698). Pin the EXACT digest shipped by the
  # v1.10.0-15 base (components/odh-notebook-controller/config/base/params.env at v1.10.0-15) so the
  # sidecar matches the controller's kube-rbac-proxy arg surface (--secure-listen-address,
  # --proxy-endpoints-port, --config-file, --tls-cert-file, ...). An origin-oauth-proxy binary here
  # crash-looped because it rejects the kube-rbac-proxy flags.
  # The 2.x lane (v1.10.0-5, branch Issue-10) keeps quay.io/jdanek/origin-oauth-proxy:latest — this
  # override lives only on the 3.x probe branch, so the 2.x lane is unchanged.
  - target:
      kind: Deployment
      name: odh-notebook-controller-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/1
        value: quay.io/opendatahub/odh-kube-auth-proxy@sha256:dcb09fbabd8811f0956ef612a0c9ddd5236804b9bd6548a0647d2b531c9d01b3
  # ods-ci relies on this label in culler.robot tests
  # oc get pod -l component.opendatahub.io/name=kf-notebook-controller -n redhat-ods-applications
  - target:
      kind: Deployment
      name: notebook-controller-deployment
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/component.opendatahub.io~1name
        value: kf-notebook-controller
---
